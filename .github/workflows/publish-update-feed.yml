name: Publish Sparkle Update Feed

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: sparkle-update-feed
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'v')
    name: Publish shared Main and Dev appcast
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - name: Check out released source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Resolve channel and current shared feed
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RELEASE_TAG" == v*-dev.* ]]; then
            echo "RELEASE_CHANNEL=dev" >> "$GITHUB_ENV"
          else
            echo "RELEASE_CHANNEL=main" >> "$GITHUB_ENV"
          fi

          feed_dir="$RUNNER_TEMP/vibebar-update-feed"
          mkdir -p "$feed_dir"
          base_appcast="$feed_dir/base-appcast.xml"
          if git ls-remote --exit-code --heads origin updates >/dev/null 2>&1; then
            git fetch --no-tags origin \
              refs/heads/updates:refs/remotes/origin/updates
            git show refs/remotes/origin/updates:appcast.xml > "$base_appcast"
            echo "BASE_APPCAST=$base_appcast" >> "$GITHUB_ENV"
          else
            echo "No existing shared appcast; this release will seed it."
          fi
          echo "FEED_DIR=$feed_dir" >> "$GITHUB_ENV"

      - name: Download published release archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --pattern '*.zip' \
            --dir "$FEED_DIR" \
            --clobber
          archives=("$FEED_DIR"/*.zip)
          if [[ ${#archives[@]} -ne 1 || ! -f "${archives[0]}" ]]; then
            echo "Expected exactly one release ZIP for $RELEASE_TAG." >&2
            exit 1
          fi
          echo "RELEASE_ARCHIVE=${archives[0]}" >> "$GITHUB_ENV"

      - name: Regenerate shared appcast from latest state
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "SPARKLE_ED_PRIVATE_KEY is required for the shared feed." >&2
            exit 1
          fi
          swift package resolve
          args=(
            --channel "$RELEASE_CHANNEL"
            --tag "$RELEASE_TAG"
            --archive "$RELEASE_ARCHIVE"
            --output "$FEED_DIR/appcast.xml"
          )
          if [[ -n "${BASE_APPCAST:-}" ]]; then
            args+=(--base-appcast "$BASE_APPCAST")
          fi
          ./Scripts/generate_update_feed.sh "${args[@]}"
          echo "RELEASE_APPCAST=$FEED_DIR/appcast.xml" >> "$GITHUB_ENV"

      - name: Publish machine-managed updates branch
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin updates >/dev/null 2>&1; then
            git fetch --no-tags origin \
              refs/heads/updates:refs/remotes/origin/updates
            git switch --force-create updates origin/updates
          else
            git switch --create updates
          fi

          cp "$RELEASE_APPCAST" appcast.xml
          if git ls-files --error-unmatch appcast.xml >/dev/null 2>&1 \
            && git diff --quiet -- appcast.xml; then
            echo "Shared appcast is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update Sparkle feed for $RELEASE_TAG"
          git push origin HEAD:updates
